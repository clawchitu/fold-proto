<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ebe7df">
  <title>折 · Fold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><b>折</b><span>Fold</span></div>
    <div class="title">
      <div id="level-name"></div>
      <div id="level-line"></div>
    </div>
    <nav>
      <button id="btn-levels">关卡</button>
      <button id="btn-hint">提示</button>
      <button id="btn-reset">重来</button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <div class="book" id="book">
      <div class="page left" id="page-left"><div class="shade"></div></div>
      <div class="page right" id="page-right"><div class="light"></div></div>
      <div class="grab" id="grab" title="拖动折痕"></div>
    </div>
  </main>

  <footer class="controls">
    <div class="readout"><span id="mode-word">打开</span><span id="angle-num">0°</span></div>
    <b class="tag coach-slider">拖到合上</b>
    <input id="fold" type="range" min="0" max="180" step="1" value="0" aria-label="折叠角度">
    <div class="presets">
      <button data-a="0">展开</button>
      <button data-a="90">半开</button>
      <button data-a="180">合上</button>
      <button id="btn-tilt" class="tilt" hidden>体感</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <div class="sheet" id="sheet-levels" hidden>
    <div class="card">
      <h2>关卡</h2>
      <div class="grid" id="level-grid"></div>
      <button class="close" data-close>关闭</button>
    </div>
  </div>

  <div class="sheet" id="sheet-win" hidden>
    <div class="card win">
      <div class="seal">成</div>
      <p id="win-text"></p>
      <button class="primary" id="btn-next">下一关</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script src="levels.js"></script>
  <script src="main.js"></script>
</body>
</html>
