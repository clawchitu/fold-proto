<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ebe7df">
  <title>折 · Fold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="a11y-suggest" class="suggest">读屏或闭眼玩？按这里开启声音模式</button>
  <header class="top">
    <div class="brand"><b>折</b><span>Fold</span></div>
    <div class="title">
      <h1 id="level-name"></h1>
      <div id="level-line"></div>
    </div>
    <nav aria-label="游戏">
      <button id="btn-levels">关卡</button>
      <button id="btn-hint" aria-keyshortcuts="H">提示</button>
      <button id="btn-reset" aria-keyshortcuts="R">重来</button>
      <button id="btn-a11y">无障碍</button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <div class="book" id="book" aria-hidden="true">
      <div class="page left" id="page-left"><div class="shade"></div></div>
      <div class="page right" id="page-right"><div class="light"></div></div>
      <div class="grab" id="grab" title="拖动折痕"></div>
    </div>
    <div id="a11y-grid" class="a11y-grid" role="grid" aria-label="书页：第1到4列是左页，第5到8列是右页" aria-describedby="grid-help"></div>
    <p id="grid-help" class="sr-only">第4列和第5列之间是折痕，合上时右页翻到左页上：第5列叠在第4列，第8列叠在第1列。方向键听每一格，回车走过去，F 折一点，Shift 加 F 展开一点，H 提示，R 重来，U 撤销，问号听全部按键。</p>
  </main>

  <footer class="controls">
    <div class="readout"><span id="mode-word">打开</span><span id="audio-badge" class="badge" hidden>声音模式</span><span id="angle-num">0°</span></div>
    <b class="tag coach-slider" aria-hidden="true">拖到合上</b>
    <input id="fold" type="range" min="0" max="180" step="1" value="0" aria-label="折叠角度" aria-keyshortcuts="F Shift+F">
    <div class="presets">
      <button data-a="0">展开</button>
      <button data-a="90">半开</button>
      <button data-a="180">合上</button>
      <button id="btn-tilt" class="tilt" hidden>体感</button>
    </div>
    <div class="bigbar" id="bigbar" hidden>
      <div class="bb-fold" role="group" aria-label="折书">
        <button data-act="fold-">展开一点</button>
        <button data-act="fold+">折一点</button>
        <button data-act="open">打开</button>
        <button data-act="close">合上</button>
        <button data-act="undo" aria-keyshortcuts="U">撤销</button>
      </div>
      <div class="bb-walk" role="group" aria-label="走一步">
        <button data-act="go-1,0" aria-label="向左走一步">左</button>
        <button data-act="go0,-1" aria-label="向上走一步">上</button>
        <button data-act="go0,1" aria-label="向下走一步">下</button>
        <button data-act="go1,0" aria-label="向右走一步">右</button>
        <button data-act="row" aria-keyshortcuts="L">听一行</button>
        <button data-act="where" aria-keyshortcuts="W">我在哪</button>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" aria-hidden="true"></div>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div class="sheet" id="sheet-levels" role="dialog" aria-modal="true" aria-labelledby="levels-title" hidden>
    <div class="card">
      <h2 id="levels-title">关卡</h2>
      <div class="grid" id="level-grid"></div>
      <button class="close" data-close>关闭</button>
    </div>
  </div>

  <div class="sheet" id="sheet-a11y" role="dialog" aria-modal="true" aria-labelledby="a11y-title" hidden>
    <div class="card">
      <h2 id="a11y-title">无障碍</h2>
      <div class="switches">
        <button role="switch" data-opt="audio" aria-checked="false"><b>声音模式</b><small>每格有音高和音色，闭眼也能玩（M）</small></button>
        <button role="switch" data-opt="speak" aria-checked="false"><b>语音朗读</b><small>没有读屏软件时，用系统语音读出提示</small></button>
        <button role="switch" data-opt="hc" aria-checked="false"><b>高对比</b><small>粗边框、花纹，不只靠颜色</small></button>
        <button role="switch" data-opt="big" aria-checked="false"><b>大格子</b><small>放大方块</small></button>
        <button role="switch" data-opt="motor" aria-checked="false"><b>大按钮</b><small>折一点、展开一点、走一步、撤销</small></button>
      </div>
      <p class="help" id="a11y-help"></p>
      <button class="close" data-close>关闭</button>
    </div>
  </div>

  <div class="sheet" id="sheet-win" role="dialog" aria-labelledby="win-text" hidden>
    <div class="card win">
      <div class="seal" aria-hidden="true">成</div>
      <p id="win-text"></p>
      <button class="primary" id="btn-next">下一关</button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script src="levels.js"></script>
  <script src="main.js"></script>
  <script src="audio.js"></script>
  <script src="a11y.js"></script>
</body>
</html>
